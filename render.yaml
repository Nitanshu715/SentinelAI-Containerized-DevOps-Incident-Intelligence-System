services:
  - type: web
    name: sentinel-ai
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-db
          property: connectionString

databases:
  - name: sentinel-db
    databaseName: sentinel
    user: postgres
    plan: free